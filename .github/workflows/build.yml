name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: for z in *.zip; do unzip -o "$z"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Get Stockfish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sf app/src/main/jniLibs/arm64-v8a
          for TAG in "" sf_17.1 sf_17 sf_16.1 sf_16; do
            gh release download $TAG --repo official-stockfish/Stockfish --pattern '*android*' --dir sf --clobber && [ -n "$(ls sf)" ] && break
          done
          ls -la sf
          cd sf
          for f in *.tar; do [ -e "$f" ] && tar -xf "$f"; done
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f"; done
          cd ..
          BIN=$(find sf -type f -name 'stockfish*armv8*' ! -name '*dotprod*' ! -name '*.tar' ! -name '*.zip' | head -n1)
          [ -z "$BIN" ] && BIN=$(find sf -type f -name 'stockfish*armv8*' ! -name '*.tar' ! -name '*.zip' | head -n1)
          echo "Using: $BIN"
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
